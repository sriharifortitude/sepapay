[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "sepapay"
version = "0.1.0"
description = "Build and independently verify SEPA Credit Transfer files (ISO 20022 pain.001.001.09) from a list of payments."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "Sri Hari Manikandan" }]
keywords = ["sepa", "iso20022", "pain.001", "payments", "iban", "banking"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Financial and Insurance Industry",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.12",
  "Topic :: Office/Business :: Financial :: Accounting",
  "Typing :: Typed",
]
dependencies = ["lxml>=5.3"]

[project.optional-dependencies]
dev = ["pytest>=8.3", "mypy>=1.13", "ruff>=0.8", "lxml-stubs>=0.5"]

[project.scripts]
sepapay = "sepapay.cli:main"

[project.urls]
Repository = "https://github.com/sriharifortitude/sepapay"

[tool.hatch.build.targets.wheel]
packages = ["src/sepapay"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "ANN", "S", "PL", "N", "C4", "T20", "DTZ"]
ignore = ["PLR2004", "S101", "PLR0913"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "ANN", "PLR", "T20"]
"src/sepapay/cli.py" = ["T20"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "tests"]
warn_unreachable = true

[tool.pytest.ini_options]
testpaths = ["tests"]
